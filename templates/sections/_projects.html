<section class="projects" id="projects">
  <div class="container">
    <h2 class="section-title">Projects</h2>

    <div class="projects-carousel" data-carousel>
      <div class="projects-track" data-carousel-track>
        <article class="project-card is-active">
          <div class="project-media">
            <img src="/static/img/project-1.webp" alt="Nama Project 1" />
            <div class="project-overlay">
              <h3 class="project-title">Portofolio Website</h3>
              <p class="project-desc"></p>
            </div>
          </div>
        </article>

        <article class="project-card">
          <div class="project-media project-media--placeholder">
            <span class="project-placeholder-text">Coming Soon!</span>
          </div>
        </article>

        <article class="project-card">
          <div class="project-media project-media--placeholder">
            <span class="project-placeholder-text">Coming Soon!</span>
          </div>
        </article>
      </div>

      <button
        type="button"
        class="carousel-arrow carousel-arrow--prev"
        data-carousel-prev
        aria-label="Project sebelumnya"
      >
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        class="carousel-arrow carousel-arrow--next"
        data-carousel-next
        aria-label="Project berikutnya"
      >
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>

      <div class="carousel-dots" data-carousel-dots>
        <button
          type="button"
          class="carousel-dot is-active"
          data-carousel-dot="0"
          aria-label="Ke project 1"
        ></button>
        <button
          type="button"
          class="carousel-dot"
          data-carousel-dot="1"
          aria-label="Ke project 2"
        ></button>
        <button
          type="button"
          class="carousel-dot"
          data-carousel-dot="2"
          aria-label="Ke project 3"
        ></button>
      </div>
    </div>
  </div>
</section>
